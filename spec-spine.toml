# spec-spine.toml governs this repository. All keys are optional; an
# absent file behaves as the defaults for a single-Cargo-workspace repo.

[meta]
# Spec 009: the harness runs `spec-spine check`, the freshness verb 0.18.0
# added; an older binary reads its exit codes wrongly. Caret range.
required_version = "0.18.0"

[manifest]
metadata_namespace = "spec-spine"

[domains]
allowed = []   # empty: the `domain` field is free-text / disabled

[kind]
allowed = []   # empty: the `kind` field is free-text / disabled

[layout]
specs_dir     = "specs"
derived_dir   = ".derived"
standards_dir = "standards/spec"

[index]
# Governance surfaces beyond the always-hashed core. Every file a spec
# claims must sit in some content hash (L-008), and a directory glob has
# to end in `**/*` to match files rather than directories (L-010).
extra_hashed_inputs = [
  "standards/**/*",
  ".github/workflows/**/*",
  ".claude/agents/**/*",
  ".claude/rules/**/*",
  ".claude/skills/**/*",
  ".claude/settings.json",
  ".mcp.json",
  "AGENTS.md",
  "CLAUDE.md",
  "Makefile",
  "README.md",
  "Cargo.lock",
  "install.sh",
]

[coupling]
waiver_keyword = "Spec-Drift-Waiver:"
bypass_prefixes = ["**/README.md"]
# The ownership ratchet (spec 032): a changed source file no spec
# specifically claims is C-002. Coverage is 100% as of spec 009.
require_ownership = true
