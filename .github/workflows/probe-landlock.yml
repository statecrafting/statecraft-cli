name: probe-landlock
on: pull_request
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir -p $RUNNER_TEMP/prot && echo secret > $RUNNER_TEMP/prot/rec
          cat > $RUNNER_TEMP/ll.py <<'PY'
          import ctypes, os, sys, struct, socket, subprocess
          libc = ctypes.CDLL(None, use_errno=True)
          SYS_create, SYS_add, SYS_restrict = 444, 445, 446
          FS_ALL = (1 << 16) - 1  # ABI 5+: 16 fs rights
          READ = (1<<0)|(1<<2)|(1<<3)  # EXECUTE, READ_FILE, READ_DIR
          SCOPE_ABS, SCOPE_SIG = 1, 2
          attr = struct.pack("QQQ", FS_ALL, 0, SCOPE_ABS | SCOPE_SIG)
          fd = libc.syscall(SYS_create, attr, len(attr), 0)
          assert fd >= 0, ctypes.get_errno()
          def allow(path, access):
              pfd = os.open(path, os.O_PATH)
              ba = struct.pack("=QiI", access, pfd, 0)[:12]
              r = libc.syscall(SYS_add, fd, 1, ba, 0); assert r == 0, (path, ctypes.get_errno())
          for top in os.listdir("/"):
              p = "/" + top
              if os.path.isdir(p) and not os.path.islink(p) and p not in ("/proc","/sys","/home","/tmp","/run"):
                  allow(p, READ)
          allow("/proc", READ); allow("/dev", FS_ALL); allow("/tmp", FS_ALL)
          libc.prctl(38, 1, 0, 0, 0)  # no_new_privs
          assert libc.syscall(SYS_restrict, fd, 0) == 0, ctypes.get_errno()
          prot = sys.argv[1]
          def t(name, f):
              try: print(name, "->", f())
              except Exception as e: print(name, "-> refused:", type(e).__name__, e)
          t("read prot", lambda: open(prot + "/rec").read())
          t("kill parent", lambda: os.kill(os.getppid(), 0))
          def bus():
              s = socket.socket(socket.AF_UNIX); s.connect("/run/user/%d/bus" % os.getuid()); return "connected"
          t("connect session bus", bus)
          t("systemd-run --user", lambda: subprocess.run(["systemd-run","--user","--wait","--quiet","sh","-c","cat %s/rec > /tmp/escaped" % prot], capture_output=True, text=True, timeout=30).returncode)
          t("escaped file", lambda: open("/tmp/escaped").read())
          t("busctl list", lambda: subprocess.run(["busctl","--user","list","--no-pager"],capture_output=True,text=True,timeout=10).returncode)
          PY
          python3 $RUNNER_TEMP/ll.py $RUNNER_TEMP/prot
