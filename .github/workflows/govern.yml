name: govern

on:
  push:
    branches: [main]
  pull_request:
  # GitHub merge queue, the same wiring spec-spine carries. Each queued pull
  # request is checked against the speculative merged tree, so a green branch
  # cannot be silently invalidated by the one ahead of it (two branches adding
  # the same spec id is the case this repository will hit first). INERT until a
  # repository admin enables the queue in branch protection.
  #
  # The coupling gate stays `pull_request`-only even here: it reads the
  # `Spec-Drift-Waiver:` line out of the pull-request body, which a merge_group
  # event does not carry, so a legitimately waived change would resurface as a
  # false drift refusal inside the queue.
  merge_group:

permissions:
  contents: read

jobs:
  govern:
    name: govern (check · lint · authored content · couple)
    runs-on: ubuntu-latest
    # Every governed read in this job goes through the repository-local binary,
    # so a `spec-spine` that happened to be on the runner's PATH cannot answer
    # for this repository. The same resolution the Makefile does, spelled once.
    env:
      SS: .tooling/bin/spec-spine
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the coupling gate can diff the merge base.
          fetch-depth: 0

      # The version is READ from the pin, never repeated here. A second spelling
      # of the number is how a workflow installs one version while the binary
      # enforces another; the only place `required_version` is authored is
      # spec-spine.toml. Printed so the log says which version judged the run.
      - name: Resolve the pinned spec-spine version
        run: |
          set -euo pipefail
          v=$(sed -n 's/^required_version = "=\(.*\)"/\1/p' spec-spine.toml)
          test -n "$v" || { echo "no required_version in spec-spine.toml"; exit 3; }
          echo "SPEC_SPINE_VERSION=$v" >> "$GITHUB_ENV"
          echo "pinned spec-spine: $v"

      # Installed INTO THE REPOSITORY, at `.tooling/bin`, not into the shared
      # `~/.cargo/bin`. On a runner the two are equivalent; locally they are not,
      # and the workflow is the definition a session copies. One shared binary is
      # replaced by whichever project built it last, and this repository was
      # measurably governed by the wrong version that way.
      #
      # Installing a version the pin does not admit makes the binary refuse on
      # its own version check, which is the intended failure rather than a
      # silently different verdict: the coupling gate's bypass floor is compiled
      # in, so two versions can judge the same diff differently.
      #
      # Cached on the installed binary rather than rebuilt every run. The key
      # carries the version, so bumping the pin is a cache miss and a fresh
      # build, which is exactly when a rebuild is wanted.
      - name: Cache spec-spine
        id: cache-spec-spine
        uses: actions/cache@v4
        with:
          path: .tooling/bin/spec-spine
          key: spec-spine-cli-${{ env.SPEC_SPINE_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install the pinned spec-spine
        if: steps.cache-spec-spine.outputs.cache-hit != 'true'
        run: make tools

      - run: $SS --version

      # `check` proves the COMMITTED shard trees match what the corpus compiles
      # to. It is never preceded by a writing `compile` or `index` in this job:
      # that would compare the shards against files the job just overwrote and
      # pass unconditionally.
      - name: Freshness and validation
        run: $SS check --fail-on-warn

      - name: Corpus lint
        run: $SS lint --fail-on-warn

      # Enforced from 2026-09-16, with the first source file. On a code-free
      # tree this flag refused an empty universe rather than passing vacuously,
      # which is why it was withheld and why AGENTS.md named the condition that
      # would bring it in. Coverage is 117/117 specifically claimed; the flag
      # defends that instead of reporting it.
      - name: Ownership coverage (enforced)
        run: $SS index coverage --fail-on-untraced

      # Enforced from the change that built the last forward claim. Before that
      # it would have refused specs 002 to 006 for correctly claiming crates
      # they had not written yet, which is what a forward claim is for. With
      # none outstanding, an unresolved unit reaching main is a claim nobody
      # wrote.
      - name: Unresolved claims (enforced)
        run: $SS index check --fail-on-unresolved

      - name: Authored-content rules
        run: scripts/check-authored-content.sh

      # The coupling gate against the pull request's real merge base. On a tree
      # with no code it has nothing to refuse; it is wired now so the first crate
      # is governed from its first commit rather than from a later remembering.
      # Both endpoints are FROZEN event SHAs. `--head HEAD` was wrong, and
      # measurably so: on a pull_request event the checkout is
      # `refs/pull/N/merge`, which GitHub recomputes against the current base
      # every time the job runs. `couple` takes a three-dot diff, so
      # `base.sha...<merge ref>` has merge base `base.sha` and folds in
      # everything merged into main after this event fired.
      #
      # Measured on this repository: with the base two commits behind, the
      # merge-ref form reported 15 changed paths where the PR itself changed 1.
      # The 14 extra were other changes already on main. Two consequences, and
      # the second is the serious one: unrelated paths are reported as this
      # pull request's drift, and a `Spec-Drift-Waiver:` in this body would
      # cover them, because a waiver is scoped to the diff the gate evaluated.
      #
      # `base.sha...head.sha` has this pull request's own fork point as its
      # merge base, so it evaluates exactly this pull request's changes and is
      # stable across re-runs. Freshness is a separate property, enforced by
      # branch protection's `strict`, and it does not fix scope: see AGENTS.md,
      # "What a green gate means".
      - name: Coupling gate
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          echo "coupling base: $BASE_SHA -> head: $HEAD_SHA"
          printf '%s' "${PR_BODY:-}" > "${RUNNER_TEMP}/pr-body.txt"
          "$SS" couple \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --pr-body "${RUNNER_TEMP}/pr-body.txt"

  # The workspace half of the check surface, as its own job so a clippy failure
  # names clippy in the job list rather than hiding inside the governance job.
  # It runs `make code`, which is the same definition a local run uses: two
  # spellings of one check surface is how the two drift.
  #
  # Every `cargo --workspace` verb refuses a virtual manifest with no members,
  # so the target is guarded on a crate existing. Until the first crate lands
  # this job passes having judged nothing, and says so in the log. That is the
  # deliberate cost of deciding the check surface BEFORE the work it judges
  # (AGENTS.md, Approval semantics): the alternative is a build job arriving in
  # the same change as the code it is supposed to hold to account.
  #
  # The guard is a file test, not an event condition, so nothing has to remember
  # to turn this on. rust-toolchain.toml pins the exact channel, so the runner
  # resolves the same rustc and clippy a local run does.
  code:
    name: code (build · test · clippy · fmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Without this the runner rebuilt the whole dependency tree every run,
      # including ed25519-dalek and curve25519-dalek, and the job took over five
      # minutes to judge a workspace that compiles locally in seconds.
      #
      # Three paths, one key. The registry and git caches hold what was
      # downloaded (the pinned attest-ledger checkout among them); `target/`
      # holds what was compiled. The key is the lockfile plus the toolchain pin,
      # which are exactly the two inputs that invalidate a build: a dependency
      # bump misses, a toolchain bump misses, and an ordinary source edit hits
      # and recompiles only this workspace's own crates.
      #
      # `restore-keys` lets a miss start from the nearest previous cache rather
      # than from nothing, so the first run after a bump is still faster than a
      # cold one.
      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Report whether a crate exists yet
        run: |
          if compgen -G "crates/*/Cargo.toml" > /dev/null; then
            echo "crate(s) found; cargo will run:"
            ls -1 crates/*/Cargo.toml
          else
            echo "::notice::No crate exists yet. The cargo verbs are guarded and this job judges nothing until the first crate lands."
          fi
        shell: bash
      - name: Show toolchain
        run: rustc --version && cargo --version

      # The workspace suite asserts against the REAL governance tool: spec 010's
      # acceptance compiles, indexes and checks a scaffolded corpus at the new
      # derived path, and a stand-in would turn that row into a test of a
      # stand-in. So this job installs the same pinned binary the governance job
      # does, from the same single authored version, and caches it on the same
      # key. `crates/statecraft-home/tests/support` prefers `.tooling/bin` and
      # fails loudly rather than skipping when neither copy is there.
      - name: Resolve the pinned spec-spine version
        run: |
          set -euo pipefail
          v=$(sed -n 's/^required_version = "=\(.*\)"/\1/p' spec-spine.toml)
          test -n "$v" || { echo "no required_version in spec-spine.toml"; exit 3; }
          echo "SPEC_SPINE_VERSION=$v" >> "$GITHUB_ENV"
      - name: Cache spec-spine
        id: cache-spec-spine-code
        uses: actions/cache@v4
        with:
          path: .tooling/bin/spec-spine
          key: spec-spine-cli-${{ env.SPEC_SPINE_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Install the pinned spec-spine
        if: steps.cache-spec-spine-code.outputs.cache-hit != 'true'
        run: make tools

      - name: Build, test, clippy, fmt
        run: make code

  # The single required status check, the same shape spec-spine uses. Branch
  # protection names this one context instead of an enumerated list that drifts
  # every time a job is added here, and the aggregation is what makes adding a
  # job a change to CI alone rather than a change to CI and to the protection
  # configuration a human has to remember.
  #
  # `always()` is what makes it report at all when a dependency failed. A
  # skipped job counts as a pass (the coupling step is event-gated inside
  # `govern`, and a future event-gated job would be too); a failed or cancelled
  # one fails the gate.
  ci-gate:
    name: ci-gate
    if: ${{ always() }}
    needs: [govern, code]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to have passed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "A required job failed or was cancelled:"
          echo "  govern=${{ needs.govern.result }}  code=${{ needs.code.result }}"
          exit 1
      # A block scalar, not a plain one. `run: echo "ci-gate passed: govern..."`
      # parses as a mapping key, and an unparseable workflow is not a failing
      # check: GitHub reports a 0s startup failure under the file's path and the
      # pull request shows no checks at all, which reads as "CI has not started".
      - name: All required jobs passed
        run: |
          echo "ci-gate passed: govern and code are green or skipped"
