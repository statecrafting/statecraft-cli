# Spec: specs/002-environment-lifecycle/spec.md
#
# The environment lifecycle: registration and qualification, the three ownership
# classes, the committed manifest, plan / apply / upgrade / remove, and doctor.
#
# A library, not a binary. Spec 002's territory is this crate; the binary that
# would expose `project register` and `env apply` as commands belongs to a spec
# that does not exist yet, and creating it here would claim territory nothing
# owns.
[package]
name = "statecraft-environment"
description = "Registration, the managed working environment, and its diagnostics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.20"

[dev-dependencies]
tempfile = "3.27.0"
# A DEV-dependency cycle, on purpose, and Cargo permits exactly this shape.
#
# Spec 004 section 3.15's two negative-case rows (an absent prerequisite, and a
# colliding declared path) are behaviors of THIS crate's adapter model, so spec
# 004's verification runs them here. Testing them against a declaration restated
# in the test file would test a copy, and the copy is what drifts. The real
# declaration lives in the adapter crate, which depends on this one, so the only
# way to reach it from a test here is a dev-dependency: it is absent from the
# library's own dependency graph and nothing in `src/` may name it.
statecraft-adapter-claude-code = { path = "../statecraft-adapter-claude-code" }

[lints.rust]
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
