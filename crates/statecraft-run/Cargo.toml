# Spec: specs/003-work-and-run-semantics/spec.md
#
# Work selection, workspace preparation, the run record, and recovery.
#
# A library, for the same reason spec 002's crate is one: the operator verbs
# belong to spec 006, which owns the binary and is not yet ratified.
[package]
name = "statecraft-run"
description = "Work selection, isolated workspaces, the run record, and recovery"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
# The record envelope, reused rather than reimplemented (spec 001 section 3.2).
# The crates.io release, pinned exactly: attest-ledger-core and
# attest-ledger-types 0.1.0 are the same source as the git revision `a9c3595`
# this crate pinned before, differing only in repository metadata (spec 003
# section 5, 2026-09-25). An exact pin because the record hash is this crate's
# persisted format; moving to a later release is its own change.
attest-ledger-core = "=0.1.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
statecraft-environment = { path = "../statecraft-environment" }
# The repository lock (spec 003 section 3.1.4 rule 7): a safe advisory
# `flock`, which the operating system releases when the holder ends. Already in
# the graph through `tempfile`; std's `File::try_lock` is newer than this
# workspace's declared rust-version.
rustix = { version = "1.1.5", features = ["fs", "process"] }

[dev-dependencies]
tempfile = "3.27.0"

[lints.rust]
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
