# Spec: specs/038-hosted-client/spec.md
#
# The only crate allowed to speak HTTP to a Statecraft cell (spec 038 section
# 2, O-5), in the way statecraft-adapter-claude-code is the only crate allowed
# to name a provider. Blocking ureq with rustls and the bundled web PKI roots:
# no async runtime, and no platform verifier whose answer differs by machine.
[package]
name = "statecraft-hosted"
description = "The hosted client: device-grant login, bearer requests and credential custody against one Statecraft cell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[package.metadata.spec-spine]
spec = "038-hosted-client"

[dependencies]
base64 = "0.22.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tempfile = "3.27.0"
thiserror = "2.0.20"
ureq = { version = "=3.4.2", default-features = false, features = ["rustls"] }

[lints]
workspace = true
