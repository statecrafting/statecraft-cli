# Spec: specs/004-execution-adapter/spec.md
#
# The execution adapter boundary: one protocol, declared capabilities, a
# qualification suite, and a constructed child environment.
#
# NO PROVIDER NAME APPEARS IN THIS CRATE. Spec 004 section 3.8 makes one a
# defect, and the seam's whole purpose is that it cannot need one. A test in
# this crate greps its own sources for provider names so the rule is mechanical
# rather than remembered.
[package]
name = "statecraft-adapter"
description = "The execution adapter seam: protocol, capabilities, qualification, and posture"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
statecraft-run = { path = "../statecraft-run" }

[dev-dependencies]
tempfile = "3.27.0"

[lints.rust]
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
