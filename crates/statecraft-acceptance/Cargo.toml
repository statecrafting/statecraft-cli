# Spec: specs/005-acceptance-and-evidence/spec.md
#
# Independent acceptance, the receipt, and the four evidence dimensions.
#
# Nothing here publishes, and nothing here authorizes a publication. A receipt
# is evidence, not a permission.
[package]
name = "statecraft-acceptance"
description = "Independent acceptance, receipts, and separately reported evidence"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
statecraft-envelope = { path = "../statecraft-envelope" }
statecraft-environment = { path = "../statecraft-environment" }
statecraft-run = { path = "../statecraft-run" }

[dev-dependencies]
tempfile = "3.27.0"

[lints.rust]
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
