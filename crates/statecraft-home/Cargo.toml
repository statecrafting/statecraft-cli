# Spec: specs/002-environment-lifecycle/spec.md
#
# The Statecraft-managed environment: the global home, the per-project area, the
# governance producer boundary, the root instruction bridge, configuration
# authority with provenance, the solo and team boundary, and the one
# initialization flow that reconciles them.
#
# A library, not a binary. Spec 006 owns the command surface, and this half of
# spec 002's
# verbs are bindings inside that crate, declared as an `extends` edge rather
# than a second binary here.
[package]
name = "statecraft-home"
description = "The Statecraft-managed global environment, project area and initialization"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.20"
statecraft-environment = { path = "../statecraft-environment" }

# The supported harness's own event shapes, for spec 002 section 3.29 rule 1.
# The admission reads the structured refusal record spec 004 section 3.3 owns,
# and that crate already parses, types and tests it. A private copy of the
# event shapes here would be a second parser for the same bytes and the one
# nobody corrects when the provider adds a field. Acyclic: nothing in that
# crate reaches back into this one.
statecraft-adapter-claude-code = { path = "../statecraft-adapter-claude-code" }

# Spec 002 section 3.30 rule 12's launch is supervised by the process-group
# supervisor spec 004 owns, which holds the deadline and kills descendants.
# Writing a second supervisor here would be a second place for that to be
# wrong. Acyclic for the same reason as the line above.
statecraft-adapter = { path = "../statecraft-adapter" }

# Spec 002 section 3.37 rule 1: an attempt's launch records live in the product
# home, keyed as the run record is keyed. The key is the run record's own
# (`statecraft_run::record::chain_path`), read from the crate that owns it
# rather than recomputed here, so a change to how a repository is keyed moves
# the launch records with the chain. Acyclic: that crate depends on
# `statecraft-environment` alone.
statecraft-run = { path = "../statecraft-run" }

# Section 3.37 rule 2 and spec 004 section 3.18 rule 4: the gate log a child
# can write is read by the supervisor without following a link, and a pipe or a
# device is refused before it can block. `O_NOFOLLOW` and `O_NONBLOCK` differ
# by platform and architecture, and the standard library does not name them.
libc = "0.2.189"

# The governance producer (spec 002 section 3.15), as an exact, reproducible
# crates.io dependency rather than a path to a sibling checkout. `=` is
# deliberate: the contract this product consumes is the shape one release
# emits, and a caret range on a 0.x line would admit a different one.
#
# `default-features = false` drops spec-spine's `symbol-resolution` feature and
# its pinned tree-sitter grammars with it. The scaffolder is a pure function of
# the configuration and needs none of them, and a `links = "tree-sitter"` clash
# with some future dependency of this workspace is a cost with no benefit here.
spec-spine-core = { version = "=0.25.0", default-features = false }

[dev-dependencies]
tempfile = "3.27.0"

[lints.rust]
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
