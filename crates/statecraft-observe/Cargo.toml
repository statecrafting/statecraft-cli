# Spec: specs/027-observation-and-proposals/spec.md
#
# Observation and proposals: what a repository's governed truth was at one
# commit, what changed since the last observation, and the typed work that
# follows, recorded and never run by this crate. A library with no binary; the
# verbs are spec 006's.
[package]
name = "statecraft-observe"
description = "Observation of one commit, closed projections and transitions, and recorded proposals"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[package.metadata.spec-spine]
spec = "027-observation-and-proposals"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
statecraft-environment = { path = "../statecraft-environment" }
# Spec 003's report reader, lifecycle policy, override journal, contract
# binding, repository key and trusted Git (section 2): reused, so the
# eligibility recorded here is the eligibility `work list` prints.
statecraft-run = { path = "../statecraft-run" }
# The chain envelope, the exact release spec 003's run record uses.
attest-ledger-core = "=0.2.0"
# The observation lock: the same advisory `flock` as spec 003's lock.
rustix = { version = "1.1.5", features = ["fs"] }
# A commit is exported beside its final name and renamed into place.
tempfile = "3.27.0"

[lints.rust]
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
