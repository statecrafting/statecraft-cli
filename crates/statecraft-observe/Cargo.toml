# Spec: specs/027-observation-and-proposals/spec.md
#
# Observation and proposals: what a repository's governed truth was at one
# commit, what changed since the last observation, and the typed work that
# follows, recorded and never run by this crate. A library with no binary; the
# verbs are spec 006's.
[package]
name = "statecraft-observe"
description = "Observation of one commit, closed projections and transitions, and recorded proposals"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[package.metadata.spec-spine]
spec = "027-observation-and-proposals"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
statecraft-environment = { path = "../statecraft-environment" }

[lints.rust]
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
