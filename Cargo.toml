# The workspace root. It has no members yet: `crates/*` matches nothing until
# the first spec is implemented, and spec 002's forward claim
# `crates/statecraft-environment/` is the one that will match first.
#
# A virtual manifest with no members is valid to Cargo and to spec-spine's
# package discovery (`cargo_workspace` in spec-spine.toml), but every
# `cargo --workspace` verb REFUSES it: "the manifest is virtual, and the
# workspace has no members". That refusal is why the Rust half of the check
# surface is guarded on a crate existing rather than simply run.
#
# Layout adopted 2026-09-16 as decision D-02: crates match the spec boundaries,
# so the coupling gate holds a real compile unit per spec rather than a
# convention. The binary crate is not created here; D-01's binary NAME is not
# adopted, and creating a crate claims territory that a ratified spec has to own.
[workspace]
resolver = "3"
members = ["crates/*"]

# Inherited by each member with `field.workspace = true`, so a member cannot
# drift on license or edition. Apache-2.0 is adopted (D-01, language and layout
# half); `version` stays at 0.0.0 because nothing is released and F-02 defers
# publication.
[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
repository = "https://github.com/statecrafting/statecraft-cli"
authors = ["The statecraft Authors"]
publish = false

# Owner decision, 2026-10-22: approve H4 workspace lint consolidation and
# the new unsafe_code = "deny" policy, retaining item-level exceptions and
# existing crate-level forbid declarations. Recorded for pull request 317
# after the owner explicitly accepted these recommended defaults.
# One lint policy for every member; each crate takes it with
# `[lints] workspace = true`. `unsafe_code` is `deny`, not `forbid`, because
# two items allow it, which `forbid` would refuse: statecraft-adapter's
# boundary probe (`#[allow(unsafe_code)] mod native;`) and the spec 040
# test constructor in crates/statecraft-cli/tests/application_equivalence/
# launch.rs (pull request 312). Crates
# that state `#![forbid(unsafe_code)]` in their root keep the stronger level.
[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# The linked governance producer (`D-06` as amended 2026-09-24). This table is
# the SINGLE STATED SOURCE of its version: a member takes it with
# `spec-spine-core.workspace = true`, and a report that names the version
# derives it from the build. Moving it is an adoption, recorded in
# docs/adoption/spec-spine.md. It names the same release as the CLI pin in
# spec-spine.toml and moves in the same change (one producer identity, H-3 (a)); a
# test refuses a difference. Changing it is an
# authority change (AGENTS.md, Source ownership).
[workspace.dependencies]
spec-spine-core = { version = "=0.32.0", default-features = false }
